<!DOCTYPE html>
<html>

<head>
  <style>
    #map {
      height: 450px;
      width: 600px;
    }
  </style>
  <title>Welcome to Alrex Driving School</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
      text-align: center;
    }

    h1 {
      font-size: 36px;
      color: #333;
      margin-bottom: 20px;
      animation: fade 2s ease-in-out infinite alternate;
    }

    @keyframes fade {
      0% {
        opacity: 1;
      }
      100% {
        opacity: 0.5;
      }
    }

    p {
      font-size: 18px;
      color: #666;
      margin-bottom: 20px;
      animation: slide 2s ease-in-out infinite alternate;
    }

    @keyframes slide {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(10px);
      }
    }

    .driving-school-img {
      width: 200px;
      height: 200px;
      margin-bottom: 20px;
      animation: rotate 2s infinite linear;
    }

    @keyframes rotate {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    .btn {
      display: inline-block;
      padding: 10px 20px;
      font-size: 18px;
      color: #fff;
      background-color: #4CAF50;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .btn:hover {
      background-color: #45a049;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Welcome to <span style="color: #4CAF50;">Alrex Driving School</span></h1>
    <img class="driving-school-img" src="uploads/ALREXLOGO.png" alt="Alrex Driving School Logo">
    <p>Get on the road to success with <span style="color: #4CAF50;">Alrex Driving School!</span><br>We provide professional and comprehensive driving lessons<br>to help you become a <span style="color: #4CAF50;">confident and skilled driver</span>.</p>
    <a class="btn" href="./?page=contact_us">Contact Us</a>
  </div>







</body>

</html>
